<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flash Flippin Greeting</title>
<style>
  :root{
    --pink:#ee2a7b;
    --tx:#f3eef1;
    --size:clamp(20px, 4.2vw, 30px);
  }
  html,body{margin:0;padding:0;background:transparent;overflow:hidden}
  body{
    font:600 var(--size)/1.25 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--tx);
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;
    min-height:100vh;
  }
  #greeting{
    padding:2px 0;
    opacity:0;
    transition:opacity .45s ease;
    white-space:normal;
  }
  #greeting.in{opacity:1}
  #greeting .name{color:var(--pink)}
  @media (prefers-reduced-motion: reduce){
    #greeting{transition:none}
  }
</style>
</head>
<body>

<div id="greeting" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------
     Flash Flippin dynamic greeting
     Single file. No dependencies. No network calls.

     Copy bank: Refined Greeting Copy Bank, Jacob Szabo, 2026-07-29.
     Supersedes the index.html Client Portal Master Spec v2 copy library.

     URL parameters (all optional):
       ?name=Jacob     first name to personalise the line
       ?bg=%231c1917   solid background instead of transparent
       ?align=center   center the line instead of left
       ?color=%23f3eef1  text colour

     Everything runs on the VIEWER's clock, so "morning" means morning
     where the client actually is.
  ------------------------------------------------------------------ */

  var params = new URLSearchParams(window.location.search);

  /* ---------- first name ---------- */
  function cleanName(raw) {
    if (!raw) return "";
    var n = String(raw).trim();
    if (!n) return "";
    n = n.split(/[\s,]+/)[0];            // first token only
    n = n.replace(/[^\p{L}\p{M}'’\-]/gu, ""); // letters, marks, apostrophes, hyphen
    if (n.length > 24) n = n.slice(0, 24);
    if (!n) return "";
    return n.charAt(0).toUpperCase() + n.slice(1);
  }
  var NAME = cleanName(params.get("name"));

  /* ---------- optional styling overrides ---------- */
  var bg = params.get("bg");
  if (bg && /^#?[0-9a-fA-F]{3,8}$/.test(bg)) {
    document.body.style.background = bg.charAt(0) === "#" ? bg : "#" + bg;
  }
  var color = params.get("color");
  if (color && /^#?[0-9a-fA-F]{3,8}$/.test(color)) {
    document.documentElement.style.setProperty("--tx", color.charAt(0) === "#" ? color : "#" + color);
  }
  if (params.get("align") === "center") {
    document.body.style.justifyContent = "center";
    document.getElementById("greeting").style.textAlign = "center";
  }

  /* ---------- line library ----------
     Each line uses {name} where the first name belongs. A line with no
     {name} token renders as written. When no name is available the token
     and its preceding comma are stripped and punctuation is tidied.
     No em dashes, per canonical handoff Section 6.1.
  ------------------------------------------------------------------ */

  var BANDS = {
    earlyAM: [
      "Up early, {name}? ☕",
      "Good morning, early bird.",
      "You beat the sunrise, {name}.",
      "An early hello, {name}.",
      "Morning starts here, {name}.",
      "Bright and early, {name}. Welcome in."
    ],
    morning: [
      "Good morning, {name} 👋",
      "Morning, {name}. Good to see you.",
      "Hello, {name}. Hope your morning is off to a good start.",
      "A fresh morning, {name}.",
      "Welcome in, {name}. ☕",
      "Morning has arrived. So have you, {name}."
    ],
    midday: [
      "Hey there, {name} 👋",
      "Good afternoon, {name}.",
      "Midday check-in, {name}.",
      "Hello again, {name}.",
      "Good timing, {name}.",
      "Hope the day’s treating you well, {name}."
    ],
    afternoon: [
      "Afternoon, {name} 👋",
      "Good afternoon, {name}. Welcome in.",
      "Back for another look, {name}?",
      "Hope your afternoon is going smoothly, {name}.",
      "A little afternoon check-in, {name}.",
      "Coffee break or portal break, {name}? ☕"
    ],
    fourTwenty: [
      "It’s 4:20, {name}. Perfect timing. 🌿",
      "Right on time, {name}. 🌿",
      "The clock knows what’s up, {name}. 🌿",
      "A timely arrival, {name}. Happy 4:20.",
      "It’s 4:20 somewhere. Here, specifically. 🌿",
      "Excellent timing, {name}. No notes. 🌿"
    ],
    evening: [
      "Good evening, {name} 👋",
      "Evening, {name}. Nice to see you.",
      "Golden hour, {name}.",
      "Welcome back, {name}.",
      "Hope your evening is going well, {name}.",
      "An evening hello, {name}."
    ],
    lateNight: [
      "Working late, {name}? 🌙",
      "Night owl mode, {name} 🦉",
      "A late-night hello, {name}.",
      "Still up, {name}? Welcome in.",
      "The portal looks good after dark.",
      "Good evening, night owl.",
      "After-hours access granted, {name}.",
      "Late night. Good timing, {name}."
    ]
  };

  /* Friday variation. Takes priority over the plain time band on Fridays,
     except during the 4:20 window and on holidays. */
  var FRIDAY = {
    day: [
      "Happy Friday, {name} 🎉",
      "Friday looks good on you, {name}.",
      "It’s Friday, {name}. Let’s make it a good one.",
      "Hello, Friday. Hello, {name}.",
      "Friday has entered the chat, {name}.",
      "A fine Friday to be here, {name}."
    ],
    evening: [
      "Weekend mode, {name} 🍻",
      "Friday evening has arrived, {name}.",
      "Welcome to the weekend, {name}.",
      "Friday night. Good timing, {name}.",
      "The weekend starts here, {name}.",
      "Happy Friday evening, {name}."
    ]
  };

  /* Holiday overrides, highest priority. */
  var HOLIDAYS = [
    { test: function (d) { return d.getMonth() === 0 && d.getDate() === 1; },
      lines: [
        "Happy New Year, {name} 🎉",
        "A fresh year begins, {name}. Let’s make it a good one.",
        "New year, fresh start. Welcome back, {name}."
      ] },
    { test: function (d) { return d.getMonth() === 3 && d.getDate() === 20; },
      lines: [
        "Happy 4/20, {name} 🌿",
        "It’s a good day to have a good day, {name}. 🌿",
        "Happy 4/20, {name}. Right on time."
      ] },
    { test: function (d) { return d.getMonth() === 6 && d.getDate() === 4; },
      lines: [
        "Happy 4th, {name} 🎆",
        "Hope your Fourth is a good one, {name}.",
        "Happy Independence Day, {name}."
      ] },
    { test: function (d) { return d.getMonth() === 9 && d.getDate() === 31; },
      lines: [
        "Happy Halloween, {name} 🎃",
        "Spooky season has arrived, {name}.",
        "Looking sharp, {name}. No costume required. 🎃"
      ] },
    { test: isThanksgiving,
      lines: [
        "Grateful for you, {name}. Happy Thanksgiving. 🦃",
        "Wishing you a warm Thanksgiving, {name}.",
        "A good day to appreciate good people. Happy Thanksgiving, {name}."
      ] },
    { test: function (d) { return d.getMonth() === 11 && d.getDate() === 25; },
      lines: [
        "Happy holidays, {name} 🎁",
        "Wishing you a wonderful holiday, {name}.",
        "Hope your holiday is merry and bright, {name}."
      ] }
  ];

  /* US Thanksgiving: fourth Thursday in November. */
  function isThanksgiving(d) {
    if (d.getMonth() !== 10 || d.getDay() !== 4) return false;
    return d.getDate() >= 22 && d.getDate() <= 28;
  }

  /* ---------- band resolution ---------- */
  function resolve(d) {
    var h = d.getHours();
    var m = d.getMinutes();
    var isFriday = d.getDay() === 5;

    for (var i = 0; i < HOLIDAYS.length; i++) {
      if (HOLIDAYS[i].test(d)) return { key: "holiday-" + i, lines: HOLIDAYS[i].lines };
    }

    /* The 4:20 special, 16:20 to 16:29 local. */
    if (h === 16 && m >= 20 && m <= 29) {
      return { key: "fourTwenty", lines: BANDS.fourTwenty };
    }

    if (isFriday) {
      if (h >= 17 && h < 21) return { key: "friday-evening", lines: FRIDAY.evening };
      if (h >= 8 && h < 17)  return { key: "friday-day", lines: FRIDAY.day };
    }

    if (h >= 5  && h < 8)  return { key: "earlyAM",   lines: BANDS.earlyAM };
    if (h >= 8  && h < 11) return { key: "morning",   lines: BANDS.morning };
    if (h >= 11 && h < 14) return { key: "midday",    lines: BANDS.midday };
    if (h >= 14 && h < 17) return { key: "afternoon", lines: BANDS.afternoon };
    if (h >= 17 && h < 21) return { key: "evening",   lines: BANDS.evening };
    return { key: "lateNight", lines: BANDS.lateNight };
  }

  /* ---------- rotation ----------
     Deterministic per day + band, so the line does not flicker on the
     60 second tick. It changes when the band changes, on a new day, or
     on a page reload.
  ------------------------------------------------------------------ */
  var SALT = Math.floor(Math.random() * 997);

  function pick(lines, key, d) {
    if (lines.length === 1) return lines[0];
    var dayIndex = Math.floor(d.getTime() / 86400000);
    var hash = SALT + dayIndex;
    for (var i = 0; i < key.length; i++) hash = (hash * 31 + key.charCodeAt(i)) % 100003;
    return lines[Math.abs(hash) % lines.length];
  }

  /* ---------- render ---------- */
  function build(template) {
    /* Returns safe DOM nodes, never innerHTML with user input. */
    var frag = document.createDocumentFragment();
    var parts;

    if (NAME) {
      parts = template.split("{name}");
    } else {
      /* No name available. Drop the token and tidy the punctuation so the
         line still reads naturally: "Good morning, {name} 👋" becomes
         "Good morning 👋". */
      var stripped = template
        .replace(/,\s*\{name\}/g, "")
        .replace(/\s*\{name\}/g, "")
        .replace(/\s+([?.!])/g, "$1")
        .replace(/\s{2,}/g, " ")
        .trim();
      frag.appendChild(document.createTextNode(stripped));
      return frag;
    }

    for (var i = 0; i < parts.length; i++) {
      if (parts[i]) frag.appendChild(document.createTextNode(parts[i]));
      if (i < parts.length - 1) {
        var span = document.createElement("span");
        span.className = "name";
        span.textContent = NAME;
        frag.appendChild(span);
      }
    }
    return frag;
  }

  var el = document.getElementById("greeting");
  var lastKey = null;
  var lastLine = null;

  function render(force) {
    var now = new Date();
    var band = resolve(now);
    var line = pick(band.lines, band.key, now);

    if (!force && band.key === lastKey && line === lastLine) return;

    var swap = function () {
      el.textContent = "";
      el.appendChild(build(line));
      el.classList.add("in");
      lastKey = band.key;
      lastLine = line;
    };

    if (lastKey === null) {
      swap();
    } else {
      el.classList.remove("in");
      setTimeout(swap, 450);
    }
  }

  render(true);

  /* 60 second refresh, so the line updates as the clock crosses a band
     boundary (including into and out of the 4:20 window) without a reload. */
  setInterval(render, 60000);

  /* Also re-check when the tab regains focus, in case the machine slept
     through several bands. */
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) render(false);
  });
})();
</script>
</body>
</html>
